[build-system]
requires = ["hatchling>=1.26,<2"]
build-backend = "hatchling.build"

[project]
name = "ravel-index"
version = "0.1.0"
description = "The right context. Almost no overhead. Local-first adaptive code and document retrieval."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{name = "Nazeeh Abdul-Hadi"}]
keywords = ["code-search", "local-first", "mcp", "semantic-search"]
classifiers = ["Development Status :: 3 - Alpha", "Programming Language :: Python :: 3", "Topic :: Text Processing :: Indexing"]
dependencies = ["pathspec>=0.12.1,<1"]

[project.optional-dependencies]
semantic = ["fastembed>=0.7,<0.8"]
documents = ["pypdf>=5,<7", "python-docx>=1.1,<2"]
dev = ["pytest>=8,<10", "build>=1.2,<2", "ruff>=0.11,<1"]

[project.scripts]
ravel = "ravel.cli:main"

[project.urls]
Homepage = "https://github.com/nazeeh111/ravel"
Documentation = "https://github.com/nazeeh111/ravel/tree/main/docs"
Issues = "https://github.com/nazeeh111/ravel/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/ravel"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
