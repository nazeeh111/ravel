<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640" role="img" aria-labelledby="title desc"><title id="title">RAVEL — The right context. Almost no overhead.</title><desc id="desc">Local-first code and document search. Several restrained teal threads converge on a copper point.</desc><rect width="1280" height="640" fill="#f5f4ef"/><path d="M64 77H1216M64 565H1216" stroke="#d8ddd5"/><text x="65" y="59" fill="#697570" font-size="12" font-family="monospace" letter-spacing="2">LOCAL-FIRST CONTEXT ENGINE</text><text x="1216" y="59" text-anchor="end" fill="#697570" font-size="12" font-family="monospace">SOURCE → SIGNAL</text><g fill="none" stroke="#21695c" stroke-width="3.5" stroke-linecap="round"><path d="M65 144C300 144 157 254 389 254"/><path d="M65 214C220 214 249 254 389 254"/><path d="M65 294C220 294 249 254 389 254"/><path d="M65 364C300 364 157 254 389 254"/></g><circle cx="389" cy="254" r="13" fill="#aa6040"/><text x="480" y="275" fill="#202c2a" font-size="100" font-family="Arial,Helvetica,sans-serif" font-weight="600" letter-spacing="12">RAVEL</text><text x="480" y="339" fill="#202c2a" font-size="29" font-family="Arial,Helvetica,sans-serif" letter-spacing="-.5">The right context.</text><text x="480" y="381" fill="#697570" font-size="29" font-family="Arial,Helvetica,sans-serif" letter-spacing="-.5">Almost no overhead.</text><text x="65" y="530" fill="#697570" font-size="14" font-family="monospace">CODE + DOCUMENTS</text><text x="1216" y="530" text-anchor="end" fill="#21695c" font-size="14" font-family="monospace">LOCAL SEARCH / SOURCE EVIDENCE / BOUNDED CONTEXT</text><text x="65" y="598" fill="#697570" font-size="12" font-family="monospace">OPEN SOURCE</text><text x="1216" y="598" text-anchor="end" fill="#697570" font-size="12" font-family="monospace">RAVELINDEX</text></svg>
