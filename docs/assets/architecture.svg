<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="560" viewBox="0 0 1120 560" role="img" aria-labelledby="title desc"><title id="title">ravel retrieval architecture</title><desc id="desc">Files are checked for exclusions and changes before SQLite lexical, structural and optional local embedding retrieval. A cost-aware planner selects a strategy. Evidence is deduplicated and packed to a context budget, then returned through the CLI, Python API, MCP or inspector.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#8b9d92"/></marker></defs><rect width="1120" height="560" rx="8" fill="#f5f4ef"/><g fill="#202c2a" font-family="Arial,Helvetica,sans-serif"><text x="40" y="45" font-size="22">From local source to useful evidence.</text><text x="40" y="72" font-size="12" fill="#697570">Freshness checks, explicit retrieval choices, and a bounded context window.</text></g><g fill="none" stroke="#8b9d92" stroke-width="1.5" marker-end="url(#arrow)"><path d="M221 232H274"/><path d="M470 232H525"/><path d="M718 232H770"/><path d="M957 232H1015V382H956"/><path d="M622 350V282"/><path d="M370 282V395H525"/></g><g fill="#fffefa" stroke="#d8ddd5"><rect x="40" y="177" width="181" height="108" rx="4"/><rect x="275" y="177" width="195" height="108" rx="4"/><rect x="525" y="177" width="193" height="108" rx="4"/><rect x="770" y="177" width="187" height="108" rx="4"/><rect x="525" y="350" width="193" height="90" rx="4"/><rect x="770" y="337" width="187" height="103" rx="4"/></g><g fill="#202c2a" font-family="Arial,Helvetica,sans-serif" font-size="16"><text x="58" y="207">Local files</text><text x="293" y="207">Safe, current index</text><text x="543" y="207">Retrieval routes</text><text x="788" y="207">Evidence packing</text><text x="543" y="379">Cost-aware planner</text><text x="788" y="368">Source-linked results</text></g><g fill="#697570" font-family="monospace" font-size="11"><text x="58" y="234">Code · Markdown · text</text><text x="58" y="254">Optional PDF / DOCX</text><text x="293" y="234">Ignores + exclusions</text><text x="293" y="254">Hashes + source locations</text><text x="543" y="234">Lexical + structure</text><text x="543" y="254">Optional local embeddings</text><text x="788" y="234">Rank + deduplicate</text><text x="788" y="254">Fit context budget</text><text x="543" y="405">Query + device budgets</text><text x="543" y="423">Strategy + depth + cache</text><text x="788" y="395">CLI · Python · MCP</text><text x="788" y="415">Local index inspector</text></g><g fill="#21695c" font-family="monospace" font-size="11" letter-spacing="1"><text x="40" y="145">INGEST</text><text x="525" y="145">RETRIEVE</text><text x="770" y="145">RETURN</text></g><path d="M40 486H1080" stroke="#d8ddd5"/><text x="40" y="518" fill="#697570" font-size="11" font-family="monospace">MODEL DOWNLOADS ARE SEPARATE FROM INDEX STORAGE</text><text x="1080" y="518" text-anchor="end" fill="#21695c" font-size="11" font-family="monospace">NO TELEMETRY · NO PAID API</text></svg>
